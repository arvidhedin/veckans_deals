name: Scrape Offers and Deploy Data

on:
  schedule:
    # GitHub often starts scheduled runs hours late, especially on the hour (the old
    # 02:00 UTC run started at 07–09 UTC). Once a night at an odd minute, early enough
    # after midnight Swedish time (UTC+2 in summer, UTC+1 in winter) that the data is
    # fresh by morning even when the run starts late:
    - cron: '17 23 * * *'  # 01:17 summer time / 00:17 winter time
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

# Never run two scrapes at the same time (a late run could overlap the next one)
concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper and build deals data
        run: |
          python build_data.py

      - name: Commit and push updated deals.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/deals.json public/product_info.json public/recipes.json data/ingredient_prices.json

          # Only commit and push if the data files have changes
          if git diff --staged --quiet; then
            echo "No changes in deals.json to commit."
          else
            git commit -m "Update deals data"
            # Someone may have pushed while the scrape was running
            git pull --rebase
            git push
          fi
